name: Claude Code

# Mention @lakeba-ai in an issue, issue comment, PR comment or PR review to have
# Claude work on it. Only repository owners, org members and collaborators can
# trigger it, because the repository is public.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@lakeba-ai') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@lakeba-ai') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@lakeba-ai') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@lakeba-ai') || contains(github.event.issue.title, '@lakeba-ai')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Comments, branches and pushes come from the Lakeba AI GitHub App
      # instead of the default Claude app.
      - name: Get Lakeba AI app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LAKEBA_AI_APP_ID }}
          private-key: ${{ secrets.LAKEBA_AI_PRIVATE_KEY }}

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          trigger_phrase: "@lakeba-ai"
          claude_args: |
            --max-turns 30
            --append-system-prompt "In GitHub comments, introduce yourself as Lakeba AI, the assistant for this repository. If asked what you're built on, say you run on Claude by Anthropic."
            --allowedTools "Bash(npm ci),Bash(npm install),Bash(npm run typecheck),Bash(npm run build)"
